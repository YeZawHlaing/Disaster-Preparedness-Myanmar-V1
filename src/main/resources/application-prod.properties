spring.application.name=v1

# DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/Disaster?createDatabaseIfNotExist=true
spring.datasource.username=yzh
spring.datasource.password=test

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.flyway.connect-retries=10
spring.flyway.connect-retry-interval=5s

# Server port
server.port=8080

# Logging
spring.mvc.log-request-details=true
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE