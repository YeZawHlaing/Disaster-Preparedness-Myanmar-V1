services:
  backend:
    image: yezawhlaing/spring-backend:prod
    container_name: backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Disaster
      SPRING_DATASOURCE_USERNAME: yzh
      SPRING_DATASOURCE_PASSWORD: test
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
