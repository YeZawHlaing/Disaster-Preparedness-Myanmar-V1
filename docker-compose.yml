version: "3.9"

services:
  mysql:
    image: mysql/mysql-server:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Disaster
      MYSQL_USER: yzh
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: spring-backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Disaster
      SPRING_DATASOURCE_USERNAME: yzh
      SPRING_DATASOURCE_PASSWORD: test
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
